<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5fb95e">
  <title>喵喵骨咯精灵 · AR</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>

<!-- Loading screen (covers the 3D scene until the model is ready) -->
<div id="loader" class="loader">
  <div class="loader-cat">😺</div>
  <p>喵喵正在赶来…</p>
</div>

<!-- First-use onboarding (shown once) -->
<div id="onboard" class="overlay hidden">
  <div class="onboard-card">
    <div class="logo">😺</div>
    <h1>喵喵咕咯精灵</h1>
    <p>一只会犯困、会撒娇、有自己小脾气的精灵</p>
    <ul class="hint">
      <li>👆 点一点屏幕 —— 摸摸它，连点会更亲昵</li>
      <li>🎤 长按麦克风 —— 跟它说话、下指令</li>
      <li>📱 摇一摇手机 —— 看它的反应</li>
      <li>📸 点右侧相机 —— 让喵喵出现在你的镜头里</li>
    </ul>
    <button id="onboardStart" class="primary-btn">开始玩 →</button>
  </div>
</div>

<!-- Main scene -->
<main id="scene">
  <!-- Camera passthrough — live feed sits behind the transparent 3D scene -->
  <video id="camFeed" playsinline muted autoplay></video>

  <model-viewer
    id="catModel"
    src="character_v2.glb"
    alt="可爱的绿色小猫精灵"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    auto-rotate-delay="3000"
    interaction-prompt="none"
    shadow-intensity="0.55"
    shadow-softness="1.0"
    exposure="1.15"
    tone-mapping="aces"
    environment-image="neutral"
    camera-orbit="90deg 85deg 0.40m"
    field-of-view="30deg"
    min-camera-orbit="auto auto 0.22m"
    max-camera-orbit="auto auto 1.5m"
    autoplay
    animation-name="idle"
    animation-loop>
    <button slot="ar-button" id="arBtn" class="ar-btn">
      <span>📷</span> 放进现实
    </button>
  </model-viewer>

  <!-- Animation buttons (bottom) -->
  <div id="animBar" class="anim-bar">
    <button class="anim-btn active" data-anim="idle"  title="待机">😺<span>待机</span></button>
    <button class="anim-btn"        data-anim="walk"  title="走">🚶<span>走路</span></button>
    <button class="anim-btn"        data-anim="run"   title="跑">🏃<span>跑步</span></button>
    <button class="anim-btn"        data-anim="attack" title="攻击">👊<span>攻击</span></button>
    <button class="anim-btn"        data-anim="hurt"  title="受伤">💥<span>受伤</span></button>
    <button class="anim-btn"        data-anim="wave"  title="招手">👋<span>招手</span></button>
    <button class="anim-btn"        data-anim="happy" title="撒娇">💕<span>撒娇</span></button>
    <button class="anim-btn"        data-anim="jump"  title="蹦">🦘<span>蹦跳</span></button>
    <button class="anim-btn"        data-anim="spin"  title="转圈">🌀<span>转圈</span></button>
    <button class="anim-btn"        data-anim="backflip" title="后空翻">🤸<span>空翻</span></button>
    <button class="anim-btn"        data-anim="twirl" title="旋跳">💫<span>旋跳</span></button>
  </div>

  <!-- Mic (voice) + chat (LLM) buttons (right side) -->
  <div id="sideBar" class="side-bar">
    <button id="camBtn" class="round-btn" title="AR互动模式" aria-label="AR互动模式">📸</button>
    <button id="feedBtn" class="round-btn" title="喂食"      aria-label="喂喵喵吃东西">🍖</button>
    <button id="micBtn" class="round-btn" title="长按说话"  aria-label="语音命令">🎤</button>
    <button id="chatBtn" class="round-btn" title="跟猫聊天" aria-label="对话精灵">💬</button>
    <button id="muteBtn" class="round-btn" title="静音"     aria-label="音效">🔊</button>
  </div>

  <!-- Status indicator (top) -->
  <div id="status" class="status"></div>

  <!-- Emote bubble — reflects the sprite's mood / current behaviour -->
  <div id="emote" class="emote"></div>

  <!-- Speech bubble — what the sprite says (chat / voice replies) -->
  <div id="sayBubble" class="say-bubble"><span id="sayText"></span></div>

  <!-- Relationship chip — tap to open the status panel -->
  <div id="bondChip" class="bond-chip">
    <span class="bond-heart">💛</span><span id="bondStage">初遇</span>
  </div>

  <!-- Dialogue choice buttons (GalGame-style) -->
  <div id="choices" class="choices hidden"></div>

  <!-- Desktop: no camera-AR — offer a QR to continue on a phone -->
  <button id="qrBtn" class="ar-btn qr-btn"><span>📱</span> 手机看AR</button>
</main>

<!-- Chat panel (hidden by default) -->
<div id="chatPanel" class="chat-panel hidden">
  <div class="chat-header">
    <span>跟喵喵聊天</span>
    <button id="chatClose" class="close-btn">✕</button>
  </div>
  <div id="chatLog" class="chat-log"></div>
  <div class="chat-input">
    <input id="chatInput" type="text" placeholder="说点什么...（试试：你饿吗？）" autocomplete="off">
    <button id="chatSend">发送</button>
  </div>
</div>

<!-- Status panel — GalGame-style character sheet -->
<div id="statusPanel" class="status-panel hidden">
  <div class="sp-card">
    <button id="spClose" class="sp-close" aria-label="关闭">✕</button>
    <div class="sp-title">😺 喵喵 · 状态</div>
    <div class="sp-stage-row"><span id="spStage" class="sp-stage">初遇</span></div>
    <div class="sp-meter">
      <span class="sp-label">💛 好感</span>
      <div class="sp-track"><div id="spAff" class="sp-fill sp-fill-aff"></div></div>
    </div>
    <div id="spAffNum" class="sp-affnum">好感度 0 / 100</div>
    <div class="sp-meter">
      <span class="sp-label">🍖 饱食</span>
      <div class="sp-track"><div id="spHunger" class="sp-fill"></div></div>
    </div>
    <div class="sp-meter">
      <span class="sp-label">⚡ 精力</span>
      <div class="sp-track"><div id="spEnergy" class="sp-fill"></div></div>
    </div>
    <div class="sp-meter">
      <span class="sp-label">😸 心情</span>
      <div class="sp-track"><div id="spMood" class="sp-fill"></div></div>
    </div>
    <div id="spDays" class="sp-days">和喵喵相伴第 1 天</div>
  </div>
</div>

<!-- QR modal — scan to open the AR-capable version on a phone -->
<div id="qrModal" class="qr-modal hidden">
  <div class="qr-card">
    <button id="qrClose" class="qr-close" aria-label="关闭">✕</button>
    <h2>在手机上和喵喵 AR 见面</h2>
    <p>电脑没有 AR 相机～用手机扫一扫，<br>就能把喵喵放进你身边的现实里。</p>
    <img id="qrImg" src="qr.png" alt="扫码打开 AR 版" width="220" height="220">
    <span class="qr-url">makinohara731.github.io/cgmiaomiao-ar</span>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
